name: fleetdm-ntfy-webhook-buildx

on:
  schedule:
    - cron: "15 10 * * Sun"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fleetdm-ntfy-webhook
        uses: actions/checkout@v4
        with:
          repository: RasterSec/fleetdm-ntfy-webhook
          ref: main
          fetch-depth: 1

      - name: Record source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push fleetdm-ntfy-webhook
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: docker.io/heywoodlh/fleetdm-ntfy-webhook:${{ steps.source.outputs.sha }}
          labels: org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
